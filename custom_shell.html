		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #050508;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Cyberpunk Scanner and Grid Overlay */
#status {
	background-color: #050508;
	background-image: 
		linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
		linear-gradient(90deg, rgba(255, 0, 127, 0.04), rgba(0, 243, 255, 0.02), rgba(0, 243, 255, 0.04)),
		linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
		linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
	background-size: 100% 4px, 6px 100%, 40px 40px, 40px 40px;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	z-index: 99;
}

/* Cyberpunk Container with cut-corners */
.cyber-container {
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	width: 80%;
	max-width: 420px;
	padding: 40px 30px;
	background: rgba(10, 10, 16, 0.88);
	border: 2px solid #00f3ff;
	box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 243, 255, 0.1);
	border-radius: 4px;
	position: relative;
	clip-path: polygon(0 0, 90% 0, 100% 10%, 100% 100%, 10% 100%, 0 90%);
	box-sizing: border-box;
}

/* Cyberpunk neon corner brackets */
.cyber-container::before {
	content: '';
	position: absolute;
	top: 0; left: 0;
	width: 25px; height: 25px;
	border-top: 4px solid #ff007f;
	border-left: 4px solid #ff007f;
}
.cyber-container::after {
	content: '';
	position: absolute;
	bottom: 0; right: 0;
	width: 25px; height: 25px;
	border-bottom: 4px solid #ff007f;
	border-right: 4px solid #ff007f;
}

/* Neon glow effect behind logo */
.logo-box {
	position: relative;
	width: 160px;
	height: 160px;
	margin-bottom: 30px;
	display: flex;
	align-items: center;
	justify-content: center;
	background: radial-gradient(circle, rgba(0, 243, 255, 0.2) 0%, transparent 70%);
}

#status-splash {
	width: 160px;
	height: 160px;
	object-fit: contain;
	image-rendering: auto;
	filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
	animation: pulse 2.5s infinite ease-in-out;
}

@keyframes pulse {
	0%, 100% {
		transform: scale(1);
		filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.4));
	}
	50% {
		transform: scale(1.05);
		filter: drop-shadow(0 0 20px rgba(255, 0, 127, 0.7));
	}
}

/* Cyberpunk Monospace Status text */
.loading-text {
	font-family: 'Share Tech Mono', monospace;
	font-size: 14px;
	color: #00f3ff;
	text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
	letter-spacing: 3px;
	margin-bottom: 20px;
	text-transform: uppercase;
	display: flex;
	align-items: center;
	gap: 4px;
}

.blink {
	animation: blink-anim 1s step-end infinite;
}

@keyframes blink-anim {
	from, to { color: transparent }
	50% { color: #00f3ff }
}

/* Redesigned progress bar */
#status-progress {
	display: none;
	width: 100%;
	height: 10px;
	-webkit-appearance: none;
	appearance: none;
	border: 1px solid #00f3ff;
	background-color: rgba(0, 243, 255, 0.05);
	box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
	border-radius: 2px;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background-color: transparent;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #00f3ff, #ff007f);
	box-shadow: 0 0 10px #ff007f, 0 0 4px #00f3ff;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #00f3ff, #ff007f);
	box-shadow: 0 0 10px #ff007f, 0 0 4px #00f3ff;
}

#status-notice {
	display: none;
	background-color: rgba(45, 15, 25, 0.85);
	border: 1px solid #ff0055;
	border-radius: 4px;
	color: #ffb3c6;
	font-family: 'Share Tech Mono', monospace;
	line-height: 1.4;
	margin-top: 25px;
	overflow: hidden;
	padding: 15px;
	text-align: center;
	z-index: 100;
	box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
	font-size: 13px;
	width: 100%;
	box-sizing: border-box;
}

				<div class="loading-text">CONNECTING TO THE GRID<span class="blink">...</span></div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					resolve();
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
